name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Static build (no adapter output; Sveltia admin present)
        run: |
          pnpm build
          admin_path=$(node -e "const y=require('js-yaml');console.log(y.load(require('fs').readFileSync('config/site.yml','utf8')).adminPath||'admin')")
          test -f "dist/$admin_path/index.html"
          test ! -e .vercel/output

      - name: Vercel build (admin routes are functions)
        env:
          VERCEL: '1'
          SESSION_SECRET: ci-build-only-not-a-real-secret-0000
        run: |
          pnpm build
          test -d .vercel/output/functions
          if grep -rq "__SCHOLAROS_ADMIN__" .vercel/output/functions; then echo "admin settings were not baked in"; exit 1; fi

      # Full demo assertions only in the template repo; forks edit content, so they get the structural check.
      # The dist-baseline comparison is a local pre-merge gate (gitignored), so CI always skips it.
      - name: Build both themes (template, full check)
        if: ${{ github.event.repository.is_template }}
        run: pnpm check:themes

      - name: Build both themes (fork, structural check)
        if: ${{ !github.event.repository.is_template }}
        run: node scripts/check-themes.mjs --structural

      - name: ESLint
        continue-on-error: true
        run: pnpm eslint .

      - name: Prettier
        continue-on-error: true
        run: pnpm prettier --check .

      - name: Astro Check
        continue-on-error: true
        run: pnpm astro check
