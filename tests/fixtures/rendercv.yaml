  sections:
    summary:
      - "AI research scientist and PhD in Computer Science specializing in representation learning, with primary applications in computational biology and drug discovery. Industry experience at Johnson and Johnson and Microsoft, where I developed language models for mRNA and machine learning systems for large scale biomedical data. Strong programming background in Python, and JavaScript, with deep experience in PyTorch, Transformers and graph neural networks. Published in NeurIPS, ICLR and Briefings in Bioinformatics, with work spanning mRNA modeling, drug target interaction prediction and algorithmic fairness."

    skills:
      - label: "Programming Languages"
        details: "Python, Dart, JavaScript, C++, C#, SQL, Solidity, MATLAB"
      - label: "Python Packages"
        details: "Pytorch, Numpy, Pandas, Keras, TensorFlow, Scikit-learn, Scipy, Networkx, iGraph, dgl, matplotlib, seaborn"
      - label: "JavaScript Frameworks"
        details: "Vue.js, Electron, NativeScript"
      - label: "Tools"
        details: "Kubernetes, Docker, Git, HTML, CSS, LATEX, AWS, Azure, Slurm"
      - label: "Quantitative Research"
        details: "Machine Learning Methods, Artificial Intelligence, Large Language Models, Generative AI, Genomics Sequence Modeling, Drug Discovery, Graph Neural Networks, Transformers, Recurrent Neural Networks, LSTMs, Mathematical Optimization, Mathematical Modeling"
      - label: "Soft Skills"
        details: "Research team coordination, Student mentoring, Technical writing, Conference presentations, Resource allocation, Strategic planning, Analytical thinking, Complex problem resolution, International team collaboration, Multicultural communication, Self-directed learning, Professional networking"

    education:
      - institution: "University of Central Florida"
        area: "Computer Science"
        degree: "PhD"
        start_date: 2021-01
        end_date: 2025-10
        highlights:
          - "Thesis: Advancing Drug Discovery with Structural and Representation Learning of Biological Systems [Link](https://stars.library.ucf.edu/etd2024/515/)"
          - "GPA: 3.91/4.0"
      - institution: "University of Central Florida"
        area: "Computer Science"
        degree: "MS"
